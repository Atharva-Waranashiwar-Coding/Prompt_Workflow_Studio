services:
  postgres:
    image: postgres:16-alpine
    container_name: pws-postgres
    environment:
      POSTGRES_DB: prompt_workflow_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prompt_workflow_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pws-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: pws-backend
    working_dir: /app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/prompt_workflow_studio
      CORS_ORIGINS: http://localhost:5173
      DEFAULT_USER_EMAIL: dev@promptworkflow.local
      DEFAULT_USER_NAME: Dev User
      ENABLE_MCP_TOOLS: "true"
      MCP_MOUNT_PATH: /mcp
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_DEFAULT_QUEUE: workflow_runs
      WORKFLOW_DEFAULT_TIMEOUT_SECONDS: 300
      WORKFLOW_DEFAULT_TOKEN_BUDGET: 8000
      WORKFLOW_DEFAULT_CONTEXT_BUDGET: 32000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
    container_name: pws-celery-worker
    working_dir: /app
    command: sh -c "celery -A app.core.celery_app:celery_app worker --loglevel=info -Q workflow_runs --concurrency=1"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/prompt_workflow_studio
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_DEFAULT_QUEUE: workflow_runs
      WORKFLOW_DEFAULT_TIMEOUT_SECONDS: 300
      WORKFLOW_DEFAULT_TOKEN_BUDGET: 8000
      WORKFLOW_DEFAULT_CONTEXT_BUDGET: 32000
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: pws-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
